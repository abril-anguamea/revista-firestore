<!DOCTYPE html>
<html>
<head>
    <title>Revista Motos</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Reportes de Accidentes</h1>
    <div id="lista-reportes"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script>
        // TU CONFIGURACIÓN YA PUESTA
        const firebaseConfig = {
            apiKey: "AIzaSyDmgRwZptdOxfXcik2uFdTWDU5vL6bmEDk",
            authDomain: "revista-motos-bb922.firebaseapp.com",
            projectId: "revista-motos-bb922",
            storageBucket: "revista-motos-bb922.firebasestorage.app",
            messagingSenderId: "335583967623",
            appId: "1:335583967623:web:20d52c49414bc834bcbb22",
            measurementId: "G-RLXLJM42WR"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function cargarReportes() {
            try {
                const querySnapshot = await db.collection("Reportes").get();
                const lista = document.getElementById("lista-reportes");
                
                if (querySnapshot.empty) {
                    lista.innerHTML = "No hay reportes todavía";
                    return;
                }

                lista.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const fechaReg = data.Fecha_Registro.toDate().toLocaleDateString();
                    
                    lista.innerHTML += `
                        <div style="border:1px solid #ccc; padding:10px; margin:10px;">
                            <h3>Reporte</h3>
                            <p><strong>Edad:</strong> ${data.Edad}</p>
                            <p><strong>Usa casco:</strong> ${data.Usa_Casco}</p>
                            <p><strong>Exceso de velocidad:</strong> ${data.Exceso_Velocidad}</p>
                            <p><strong>Tipo:</strong> ${data.Tipo_Incidente}</p>
                            <p><strong>Lesiones:</strong> ${data.Lesiones}</p>
                            <p><strong>Ubicación:</strong> ${data.Ubicacion}</p>
                            <p><strong>Fecha accidente:</strong> ${data.Fecha_Accidente}</p>
                            <p><strong>Fecha registro:</strong> ${fechaReg}</p>
                            ${data.Link ? `<a href="${data.Link}" target="_blank">Ver evidencia</a>` : ''}
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById("lista-reportes").innerHTML = 
                `<div style="color:red; padding:20px;">
                    <h3>ERROR:</h3>
                    <p>${error.message}</p>
                </div>`;
                console.log("Error completo:", error);
            }
        }

        cargarReportes();
    </script>
</body>
</html>
