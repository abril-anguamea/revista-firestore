<!DOCTYPE html>
<html>
<head>
    <title>Revista Motos</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Reportes de Accidentes</h1>
    <div id="lista-reportes"></div>

    <!-- Firebase compat - ESTE SÍ JALA EN GITHUB -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script>
        // TU CONFIGURACIÓN YA PUESTA
        const firebaseConfig = {
            apiKey: "AIzaSyDmgRwZptdOxfXcik2uFdTWDU5vL6bmEDk",
            authDomain: "revista-motos-bb922.firebaseapp.com",
            projectId: "revista-motos-bb922",
            storageBucket: "revista-motos-bb922.firebasestorage.app",
            messagingSenderId: "335583967623",
            appId: "1:335583967623:web:20d52c49414bc834bcbb22",
            measurementId: "G-RLXLJM42WR"
        };
        
        // INICIA FIREBASE
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // CARGA LOS REPORTES
        async function cargarReportes() {
            const querySnapshot = await db.collection("Reportes").get();
            const lista = document.getElementById("lista-reportes");
            
            lista.innerHTML = '';

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const fechaReg = data.Fecha_Registro.toDate().toLocaleDateString();
                
                lista.innerHTML += `
                    <div class="reporte">
                        <h3>Reporte de Accidente</h3>
                        <div><strong>Edad:</strong> ${data.Edad}</div>
                        <div><strong>Usa casco:</strong> ${data.Usa_Casco}</div>
                        <div><strong>Exceso de velocidad:</strong> ${data.Exceso_Velocidad}</div>
                        <div><strong>Tipo:</strong> ${data.Tipo_Incidente}</div>
                        <div><strong>Lesiones:</strong> ${data.Lesiones}</div>
                        <div><strong>Ubicación:</strong> ${data.Ubicacion}</div>
                        <div><strong>Fecha accidente:</strong> ${data.Fecha_Accidente}</div>
                        <div><strong>Fecha registro:</strong> ${fechaReg}</div>
                        ${data.Link ? `<a href="${data.Link}" target="_blank">Ver evidencia</a>` : ''}
                    </div><hr>
                `;
            });
        }

        cargarReportes();
    </script>
</body>
</html>
