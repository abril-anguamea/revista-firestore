<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Agregar Reporte</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f0f0f0; max-width: 600px; margin: auto; }
    input, select { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
    label { font-weight: bold; }
    .boton { background: #e63946; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
    .boton:hover { background: #c1121f; }
  </style>
</head>
<body>
  <h1>Agregar Nuevo Reporte de Accidente</h1>
  <form id="form-reporte">
    <label>Edad:</label>
    <input type="number" id="Edad" required>
    
    <label>¿Usaba casco?</label>
    <select id="Usa_Casco" required>
      <option value="Sí">Sí</option>
      <option value="No">No</option>
    </select>
    
    <label>¿Exceso de velocidad?</label>
    <select id="Exceso_Velocidad" required>
      <option value="Sí">Sí</option>
      <option value="No">No</option>
    </select>
    
    <label>Tipo de incidente:</label>
    <input type="text" id="Tipo_Incidente" required>
    
    <label>Lesiones:</label>
    <input type="text" id="Lesiones" required>
    
    <label>Ubicación:</label>
    <input type="text" id="Ubicacion" required>
    
    <label>Fecha del accidente:</label>
    <input type="date" id="Fecha_Accidente" required>
    
    <label>Link de evidencia:</label>
    <input type="url" id="Link">
    
    <button type="submit" class="boton">Guardar Reporte</button>
  </form>
  <br>
  <a href="index.html">← Volver a reportes</a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAL7n_6pLRoOaKF94aFIREu9CBTw0HcYOw",
      authDomain: "revista-motos.firebaseapp.com",
      projectId: "revista-motos",
      storageBucket: "revista-motos.firebasestorage.app",
      messagingSenderId: "554552666157",
      appId: "1:554552666157:web:5ca3ad332829931436f0a4",
      measurementId: "G-P0K13K3C8R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("form-reporte").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      await addDoc(collection(db, "Reportes"), {
        Edad: parseInt(document.getElementById("Edad").value),
        Usa_Casco: document.getElementById("Usa_Casco").value,
        Exceso_Velocidad: document.getElementById("Exceso_Velocidad").value,
        Tipo_Incidente: document.getElementById("Tipo_Incidente").value,
        Lesiones: document.getElementById("Lesiones").value,
        Ubicacion: document.getElementById("Ubicacion").value,
        Fecha_Accidente: document.getElementById("Fecha_Accidente").value,
        Link: document.getElementById("Link").value,
        Fecha_Registro: serverTimestamp()
      });

      alert("Reporte guardado con éxito wey");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
